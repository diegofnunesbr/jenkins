controller:
  image:
    registry: docker.io
    repository: library/jenkins-homelab
    tag: local
    pullPolicy: IfNotPresent

  serviceType: ClusterIP

  ingress:
    enabled: true
    ingressClassName: nginx
    hostName: jenkins.diegofnunesbr.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-clusterissuer
    tls:
      - secretName: jenkins-tls
        hosts:
          - jenkins.diegofnunesbr.com

  admin:
    existingSecret: jenkins-admin-secret

  numExecutors: 2

  initializeOnce: true

  initContainerEnv:
    - name: JAVA_TOOL_OPTIONS
      value: "-Dsun.net.client.defaultConnectTimeout=15000 -Dsun.net.client.defaultReadTimeout=30000"

  containerEnv:
    - name: JENKINS_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: jenkins-oidc
          key: clientSecret

  additionalPlugins:
    - ssh-agent
    - workflow-cps-global-lib
    - oic-auth
    - role-strategy

  JCasC:
    configScripts:
      security: |
        jenkins:
          securityRealm:
            oic:
              serverConfiguration:
                wellKnown:
                  wellKnownOpenIDConfigurationUrl: "https://keycloak.diegofnunesbr.com/realms/home/.well-known/openid-configuration"
                  scopesOverride: "openid email profile"
              clientId: "jenkins"
              clientSecret: "${JENKINS_OIDC_CLIENT_SECRET}"
              userNameField: "preferred_username"
              fullNameFieldName: "name"
              emailFieldName: "email"
              groupsFieldName: "groups"
              logoutFromOpenidProvider: true
              postLogoutRedirectUrl: "https://jenkins.diegofnunesbr.com"
          authorizationStrategy:
            roleBased:
              roles:
                global:
                  - name: "admin"
                    description: "Login pelo Keycloak, grupo jenkins-admins"
                    permissions:
                      - "Overall/Administer"
                    entries:
                      - group: "jenkins-admins"
      global-pipeline-libraries: |
        unclassified:
          globalLibraries:
            libraries:
              - name: "shared-libraries"
                defaultVersion: "main"
                retriever:
                  modernSCM:
                    scm:
                      git:
                        remote: "https://github.com/diegofnunesbr/shared-libraries.git"
