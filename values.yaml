controller:
  image:
    registry: docker.io
    repository: library/jenkins-homelab
    tag: local
    pullPolicy: IfNotPresent

  serviceType: NodePort
  nodePort: 30880

  admin:
    existingSecret: jenkins-admin-secret

  numExecutors: 2

  initializeOnce: true

  initContainerEnv:
    - name: JAVA_TOOL_OPTIONS
      value: "-Dsun.net.client.defaultConnectTimeout=15000 -Dsun.net.client.defaultReadTimeout=30000"

  additionalPlugins:
    - ssh-agent
    - workflow-cps-global-lib

  JCasC:
    configScripts:
      global-pipeline-libraries: |
        unclassified:
          globalLibraries:
            libraries:
              - name: "shared-libraries"
                defaultVersion: "main"
                retriever:
                  modernSCM:
                    scm:
                      git:
                        remote: "https://github.com/diegofnunesbr/shared-libraries.git"
